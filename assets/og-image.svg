<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B14"/>
      <stop offset="1" stop-color="#0E1526"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="300" x2="1120" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="mark" x1="96" y1="96" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" stroke="rgba(148,163,184,0.07)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- logo mark -->
  <rect x="88" y="88" width="72" height="72" rx="20" stroke="url(#mark)" stroke-width="6"/>
  <path d="M112 136V112L136 136V112" stroke="url(#mark)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- brand -->
  <text x="184" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#E9EEFB">NeauralStack Labs</text>
  <text x="184" y="156" font-family="Menlo, Consolas, monospace" font-size="18" letter-spacing="4" fill="#A9B6CE">APPLIED AI &amp; ENGINEERING STUDIO</text>

  <!-- headline -->
  <text x="88" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" fill="#E9EEFB">Make your data</text>
  <text x="88" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" fill="#9DB8FF">work smarter.</text>

  <!-- subline -->
  <text x="88" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#A9B6CE">Practical ML, automation, integrations, and technical tools</text>
  <text x="88" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#A9B6CE">for real business problems.</text>

  <!-- right-side node motif -->
  <g opacity="0.9">
    <circle cx="950" cy="220" r="10" fill="#5B8CFF"/>
    <circle cx="1080" cy="300" r="10" fill="#8B5CF6"/>
    <circle cx="950" cy="380" r="10" fill="#34D3E0"/>
    <circle cx="1060" cy="470" r="10" fill="#5B8CFF"/>
    <path d="M950 220L1080 300L950 380L1060 470" stroke="url(#accent)" stroke-width="2.5"/>
    <path d="M950 220L950 380" stroke="rgba(148,163,184,0.35)" stroke-width="2"/>
    <rect x="880" y="150" width="260" height="380" rx="24" stroke="rgba(148,163,184,0.25)" stroke-width="2"/>
  </g>

  <!-- accent line -->
  <rect x="88" y="548" width="1024" height="4" rx="2" fill="url(#accent)"/>
</svg>
